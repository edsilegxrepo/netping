version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*database/sql.DB).Close
        - (*database/sql.Stmt).Close
        - (*bufio.Writer).Flush
        - (*bufio.Writer).WriteString
        - (*encoding/json.Encoder).Encode
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
